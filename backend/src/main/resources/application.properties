spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=${BACKEND_PORT:8080}

spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST}:${SUPABASE_PORT}/${SUPABASE_DB}
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

bloodlink.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
bloodlink.telegram.default-chat-id=${TELEGRAM_TEST_CHAT_ID:}
bloodlink.ml.base-url=${ML_SERVICE_BASE_URL:${ML_API_URL:http://localhost:8087}}
bloodlink.ml.top-n=${ML_TOP_N_DONORS:5}